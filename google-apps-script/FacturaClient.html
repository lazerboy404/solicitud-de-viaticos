<script>
(() => {
  'use strict';
  const TEST_MODE = true;
  const PRODUCTION_RECIPIENT = 'facturacion@centralponiente.com.mx';
  const TAX_CERTIFICATE_NAME = 'SAT Constancia.pdf';
  const MAX_BYTES = 8 * 1024 * 1024;
  const form = document.getElementById('invoice-form');
  const dateInput = document.getElementById('invoice-date');
  const recipientInput = document.getElementById('invoice-recipient');
  const ticketInput = document.getElementById('invoice-ticket');
  const subject = document.getElementById('invoice-subject');
  const body = document.getElementById('invoice-body');
  const sendButton = document.getElementById('invoice-send');
  const dialog = document.getElementById('invoice-confirmation');
  const status = document.getElementById('invoice-status');
  const notification = document.getElementById('invoice-notification');
  const thumbnail = document.getElementById('ticket-thumbnail');
  const longDate = new Intl.DateTimeFormat('es-MX', { day: '2-digit', month: 'long', year: 'numeric', timeZone: 'UTC' });
  let pending = null;
  let busy = false;
  let thumbnailUrl = null;

  function parseDate(value) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return null;
    const [year, month, day] = value.split('-').map(Number);
    const date = new Date(Date.UTC(year, month - 1, day, 12));
    return year >= 2000 && year <= 2100 && date.getUTCFullYear() === year && date.getUTCMonth() === month - 1 && date.getUTCDate() === day ? date : null;
  }
  function shortDate(value) { return value.split('-').reverse().join('/'); }
  function render() {
    const date = parseDate(dateInput.value);
    subject.textContent = date ? `SOLICITUD DE FACTURA ${shortDate(dateInput.value)}` : 'SOLICITUD DE FACTURA · Selecciona una fecha';
    document.getElementById('invoice-preview-recipient').textContent = recipientInput.value.trim() || 'Escribe tu correo de prueba';
    body.innerHTML = date ? `<p>Buenos dias,</p><p>Por este medio le solicito de la manera más amable mi factura del estacionamiento ocupado el día ${longDate.format(date)}.</p><p>Adjunto a este correo encontrará mi ticket y mi constancia de situación fiscal con los datos necesarios para la facturación.</p><p>Agradezco de antemano su atención y apoyo con esta solicitud.</p><p>Atentamente,<br>Einar Ulises Arenas Hernandez</p>` : '<p>Selecciona una fecha válida para generar el mensaje.</p>';
    document.getElementById('invoice-preview-pdf').textContent = `PDF · ${TAX_CERTIFICATE_NAME} (fijo)`;
    document.getElementById('invoice-preview-ticket').textContent = ticketInput.files[0] ? `Ticket · ${ticketInput.files[0].name}` : 'Ticket pendiente';
  }
  function notify(message, type) {
    status.textContent = message;
    status.className = `status ${type}`;
    status.hidden = false;
    notification.className = `notification ${type}`;
    document.getElementById('invoice-notification-icon').textContent = type === 'success' ? '✓' : '!';
    document.getElementById('invoice-notification-title').textContent = type === 'success' ? '¡Solicitud enviada con adjuntos!' : 'No se pudo enviar';
    document.getElementById('invoice-notification-message').textContent = message;
    notification.hidden = false;
  }
  function setBusy(value) {
    busy = value;
    for (const control of [dateInput, recipientInput, ticketInput, sendButton]) control.disabled = value;
    form.setAttribute('aria-busy', String(value));
    sendButton.classList.toggle('is-loading', value);
    document.getElementById('invoice-send-label').textContent = value ? 'Enviando...' : 'Revisar y enviar solicitud';
  }
  function readFile(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve({ name: file.name, data: String(reader.result).split(',')[1] });
      reader.onerror = () => reject(new Error(`No se pudo leer ${file.name}. Selecciónalo de nuevo.`));
      reader.onabort = () => reject(new Error('Se interrumpió la lectura de los archivos.'));
      reader.readAsDataURL(file);
    });
  }
  function requestId() {
    if (!window.crypto || !window.crypto.getRandomValues) throw new Error('Este navegador no permite crear un identificador seguro para el envío.');
    return Array.from(window.crypto.getRandomValues(new Uint8Array(24)), value => value.toString(16).padStart(2, '0')).join('');
  }
  function send(payload) {
    google.script.run
      .withSuccessHandler(result => {
        setBusy(false);
        if (result && result.ok === true) notify(`Google confirmó el envío a ${result.recipient}, con el PDF y la foto del ticket adjuntos.`, 'success');
        else notify('El servicio no confirmó el envío. Revisa Enviados en Gmail antes de volver a intentarlo.', 'error');
      })
      .withFailureHandler(error => {
        setBusy(false);
        notify(error && error.message ? error.message : 'No se pudo confirmar el envío. Revisa Ejecuciones en Apps Script y Enviados en Gmail antes de reintentar.', 'error');
      })
      .sendInvoiceRequest(payload);
  }
  dateInput.addEventListener('input', render);
  recipientInput.addEventListener('input', () => { status.hidden = true; render(); });
  ticketInput.addEventListener('change', () => { status.hidden = true; render(); });
  ticketInput.addEventListener('change', () => {
    if (thumbnailUrl) URL.revokeObjectURL(thumbnailUrl);
    thumbnailUrl = null;
    thumbnail.hidden = true;
    const file = ticketInput.files[0];
    if (file && /\.(jpe?g|png|webp)$/i.test(file.name) && file.size <= MAX_BYTES) {
      thumbnailUrl = URL.createObjectURL(file);
      thumbnail.src = thumbnailUrl;
      thumbnail.hidden = false;
    }
  });
  thumbnail.addEventListener('error', () => { thumbnail.hidden = true; });
  document.getElementById('invoice-notification-close').addEventListener('click', () => { notification.hidden = true; });
  document.getElementById('invoice-cancel').addEventListener('click', () => dialog.close());
  dialog.addEventListener('cancel', () => { pending = null; });
  dialog.addEventListener('close', () => { if (!dialog.open) pending = null; });
  form.addEventListener('submit', event => {
    event.preventDefault();
    if (busy || dialog.open) return;
    recipientInput.value = TEST_MODE ? recipientInput.value.trim() : PRODUCTION_RECIPIENT;
    render();
    if (!form.reportValidity()) return;
    if (!parseDate(dateInput.value)) return notify('Selecciona una fecha válida entre 2000 y 2100.', 'error');
    const ticket = ticketInput.files[0];
    if (!ticket) return notify('Selecciona la foto del ticket.', 'error');
    if (!/\.(jpe?g|png|webp)$/i.test(ticket.name)) return notify('La foto del ticket debe ser JPG, PNG o WEBP.', 'error');
    if (!ticket.size || ticket.size > MAX_BYTES) return notify('Selecciona una foto no vacía de máximo 8 MB. La constancia fija se suma en el servidor.', 'error');
    pending = { recipient: recipientInput.value, date: dateInput.value, mode: TEST_MODE ? 'test' : 'production', ticket };
    document.getElementById('invoice-confirm-to').textContent = pending.recipient;
    document.getElementById('invoice-confirm-subject').textContent = subject.textContent;
    document.getElementById('invoice-confirm-files').textContent = `${TAX_CERTIFICATE_NAME} + ${ticket.name}`;
    dialog.showModal();
  });
  document.getElementById('invoice-confirm').addEventListener('click', async () => {
    if (busy || !pending || !dialog.open) return;
    const snapshot = pending;
    pending = null;
    setBusy(true);
    status.hidden = true;
    notification.hidden = true;
    dialog.close();
    try {
      const attachments = await Promise.all([readFile(snapshot.ticket)]);
      send({ requestId: requestId(), recipient: snapshot.recipient, date: snapshot.date, mode: snapshot.mode, attachments });
    } catch (error) {
      setBusy(false);
      notify(error.message || 'No se pudieron preparar los archivos.', 'error');
    }
  });
  if (!TEST_MODE) {
    document.getElementById('invoice-mode').textContent = 'Solicitud de factura · Envío al estacionamiento';
    document.getElementById('invoice-recipient-label').textContent = 'Destinatario';
    document.getElementById('invoice-recipient-help').textContent = 'Correo de facturación del estacionamiento.';
    recipientInput.value = PRODUCTION_RECIPIENT;
    recipientInput.readOnly = true;
  }
  const today = new Date();
  dateInput.value = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
  render();
})();
</script>
